<dialog class="lightbox" id="lightbox" aria-labelledby="lb-title" data-email="{{ site.data.settings.email }}">
  <div class="lightbox-inner">
    <img id="lb-img" src="" alt="">
    <div class="lightbox-info">
      <h2 id="lb-title"></h2>
      <p id="lb-medium"></p>
      <p id="lb-dims"></p>
      <p id="lb-status"></p>
      <a class="btn" id="lb-enquire" href="#">Enquire about this work</a>
      <div class="lightbox-nav">
        <button type="button" id="lb-prev" aria-label="Previous artwork">←</button>
        <button type="button" id="lb-next" aria-label="Next artwork">→</button>
      </div>
    </div>
  </div>
  <button type="button" class="lightbox-close" id="lb-close" aria-label="Close">×</button>
</dialog>
