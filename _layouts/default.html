<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ead6b4">
  {% seo %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/gloock-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% assign s = site.data.settings %}
  <header class="site-header">
    <div class="container">
      <a class="logo" href="{{ '/' | relative_url }}">{{ s.short_name }}</a>
      <nav class="nav" aria-label="Main">
        <a href="{{ '/work/' | relative_url }}"{% if page.nav == 'work' %} aria-current="page"{% endif %}>Work</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/contact/' | relative_url }}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© {{ 'now' | date: '%Y' }} {{ s.name }} · {{ s.location }}</span>
      <nav aria-label="Footer">
        <a href="https://www.instagram.com/{{ s.instagram }}/" rel="noopener">Instagram @{{ s.instagram }}</a>
        <a href="mailto:{{ s.email }}">{{ s.email }}</a>
      </nav>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
